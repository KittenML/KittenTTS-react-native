buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

allprojects {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "com.microsoft.onnxruntime" &&
                    details.requested.name.startsWith("onnxruntime-android")) {
                details.useVersion("1.24.3")
                details.because("onnxruntime-react-native uses latest.integration, which is brittle in example builds")
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
